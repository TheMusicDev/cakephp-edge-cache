name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: PHP ${{ matrix.php }}${{ matrix.lowest && ' (lowest dependencies)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        lowest: [false]
        include:
          - php: '8.2'
            lowest: true
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.lowest && '--prefer-lowest --prefer-stable' || '' }}
      - name: Run tests
        run: vendor/bin/phpunit

  quality:
    name: Coding standard and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl
          coverage: none
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Coding standard
        run: vendor/bin/phpcs
      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress
